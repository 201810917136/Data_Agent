version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=pass
      - POSTGRES_DB=ai_auction
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./data/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d ai_auction"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://user:pass@postgres:5432/ai_auction
      - AGNES_API_KEY=sk-bchEYgDebbqGGcqupTB1ccQ6eoo4D8MOcL6MnmAIeQFXDLU3
      - LANGFUSE_PUBLIC_KEY=pk-lf-10f5bad9-ae41-4b7b-b270-5dac75a97bb1
      - LANGFUSE_SECRET_KEY=sk-lf-df6614e8-c25d-409c-bc23-00f1167bd962
      - LANGFUSE_BASE_URL=https://cloud.langfuse.com
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:




